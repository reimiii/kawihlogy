services:
  app:
    build: .
    command: pnpm start:prod
    env_file: .env
    expose:
      - '${PORT}'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:${PORT}/health']
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s

  worker:
    build: .
    command: pnpm start:worker
    env_file: .env
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
